{% extends "base.html" %}{% block title %}Apply for training{% endblock %}{% block body %}<div class="shell" style="max-width:850px"><header class="topbar"><a class="brand" href="/">Professional<span style="color:#2861dc">.</span></a><a href="/">Back to home</a></header><div class="page-head"><div><h1>Apply for training</h1><div class="muted">Send your details. The admin will review your application.</div></div></div>{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}<form method="post" class="panel">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Full name *</label><input required name="full_name" class="form-control"></div><div class="col-md-6"><label class="form-label">Phone *</label><input required name="phone" class="form-control"></div><div class="col-md-6"><label class="form-label">Date of birth</label><input type="date" name="date_of_birth" class="form-control"></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div><div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2"></textarea></div><div class="col-md-6"><label class="form-label">Course *</label><select required name="course" id="course" class="form-select"><option value="">Choose course</option>{% for c in courses %}<option value="{{ c.pk }}" data-category="{{ c.category }}">{{ c.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Preferred vehicle</label><select name="vehicle" id="vehicle" class="form-select"><option value="">No preference</option>{% for v in vehicles %}<option value="{{ v.pk }}" data-category="{{ v.category }}">{{ v.vehicle_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Preferred start date</label><input type="date" name="preferred_start_date" class="form-control"></div><div class="col-12"><button class="btn btn-primary">Submit application</button></div></div></form></div><script>const c=document.getElementById('course'),v=document.getElementById('vehicle');c.addEventListener('change',()=>{[...v.options].forEach(o=>{o.hidden=!!o.dataset.category&&o.dataset.category!==c.selectedOptions[0].dataset.category})})</script>{% endblock %}
