{% extends "admin/base_admin.html" %}{% block content %}<div class="page-head"><div><h1>Record payment</h1><div class="muted">Confirm the amount only after checking the bank or UPI transaction.</div></div></div><form method="post" class="panel">{% csrf_token %}<div class="row g-3"><div class="col-12"><label class="form-label">Admission</label><select name="admission" required class="form-select"><option value="">Choose admission</option>{% for a in admissions %}<option value="{{ a.pk }}">{{ a.customer.full_name }} · {{ a.course.name }} · ₹{{ a.custom_fee }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Amount received (₹)</label><input name="amount" type="number" min=".01" step=".01" required class="form-control"></div><div class="col-md-6"><label class="form-label">Payment method</label><select name="payment_method" class="form-select"><option value="upi_manual">UPI (manual verification)</option><option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option></select></div><div class="col-12"><label class="form-label">UPI / bank transaction reference (optional)</label><input name="transaction_reference" class="form-control" placeholder="UTR or UPI transaction ID"></div><div class="col-12"><button class="btn btn-primary">Confirm payment received</button></div></div></form>{% endblock %}
