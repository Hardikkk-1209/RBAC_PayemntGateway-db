{% extends "admin/base_admin.html" %}{% block content %}<div class="page-head"><div><h1>Add employee</h1><div class="muted">Add a trainer or another staff member.</div></div></div><form method="post" class="panel">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Employee name</label><input name="employee_name" required class="form-control"></div><div class="col-md-6"><label class="form-label">Phone</label><input name="phone" required class="form-control"></div><div class="col-md-4"><label class="form-label">Designation</label><select name="designation" class="form-select"><option value="trainer">Trainer</option><option value="office">Office staff</option><option value="other">Other</option></select></div><div class="col-md-4"><label class="form-label">Joining date</label><input type="date" name="joining_date" class="form-control"></div><div class="col-md-4"><label class="form-label">Monthly salary (₹)</label><input type="number" min="0" step=".01" name="monthly_salary" value="0" class="form-control"></div><div class="col-12"><button class="btn btn-primary">Save employee</button></div></div></form>{% endblock %}
