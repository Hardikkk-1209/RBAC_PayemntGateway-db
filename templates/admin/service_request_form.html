{% extends "admin/base_admin.html" %}{% block content %}<div class="page-head"><div><h1>New service request</h1><div class="muted">Create a licence, RC or vehicle service record.</div></div></div><form method="post" class="panel">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Customer</label><select name="customer" required class="form-select">{% for c in customers %}<option value="{{ c.pk }}">{{ c.full_name }} · {{ c.phone }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Service</label><select name="service" required class="form-select">{% for s in services %}<option value="{{ s.pk }}">{{ s.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Application date</label><input type="date" name="application_date" class="form-control"></div><div class="col-md-4"><label class="form-label">Custom fee (₹)</label><input name="custom_fee" type="number" min="0" step=".01" value="0" class="form-control"></div><div class="col-md-4"><label class="form-label">Assigned employee</label><select name="assigned_employee" class="form-select"><option value="">Unassigned</option>{% for e in employees %}<option value="{{ e.pk }}">{{ e.employee_name }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Remarks</label><textarea name="remarks" class="form-control"></textarea></div><div class="col-12"><button class="btn btn-primary">Create request</button></div></div></form>{% endblock %}
