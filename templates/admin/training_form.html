{% extends "admin/base_admin.html" %}{% block content %}<div class="page-head"><div><h1>Schedule training</h1><div class="muted">Assign one customer, trainer and vehicle.</div></div></div><form method="post" class="panel">{% csrf_token %}<div class="row g-3"><div class="col-12"><label class="form-label">Admission</label><select name="admission" required class="form-select">{% for a in admissions %}<option value="{{ a.pk }}">{{ a.customer.full_name }} · {{ a.course.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Date</label><input type="date" name="session_date" required class="form-control"></div><div class="col-md-4"><label class="form-label">Start time</label><input type="time" name="start_time" value="22:00" class="form-control"></div><div class="col-md-4"><label class="form-label">End time</label><input type="time" name="end_time" required class="form-control" value="22:30"></div><div class="col-md-4"><label class="form-label">Trainer</label><select name="trainer" required class="form-select">{% for e in employees %}<option value="{{ e.pk }}">{{ e.employee_name }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Vehicle (optional; defaults to admission vehicle)</label><select name="vehicle" class="form-select"><option value="">Admission vehicle</option>{% for v in vehicles %}<option value="{{ v.pk }}">{{ v.vehicle_name }} · {{ v.registration_number }}</option>{% endfor %}</select></div><div class="col-12"><button class="btn btn-primary">Save session</button></div></div></form>{% endblock %}
