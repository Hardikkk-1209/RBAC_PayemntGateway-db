{% extends "admin/base_admin.html" %}{% block content %}<div class="page-head"><div><h1>Add vehicle</h1><div class="muted">Register a school vehicle.</div></div></div><form method="post" class="panel">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Vehicle name</label><input name="vehicle_name" required class="form-control" placeholder="Ertiga"></div><div class="col-md-6"><label class="form-label">Registration number</label><input name="registration_number" required class="form-control" placeholder="MH 00 AB 1234"></div><div class="col-md-4"><label class="form-label">Category</label><select name="category" class="form-select"><option value="2w">Two wheeler</option><option value="4w">Four wheeler</option></select></div><div class="col-md-4"><label class="form-label">Fuel type</label><select name="fuel_type" class="form-select"><option value="petrol">Petrol</option><option value="cng">CNG</option><option value="diesel">Diesel</option><option value="electric">Electric</option></select></div><div class="col-md-4"><label class="form-label">Current odometer (km)</label><input name="current_odometer" type="number" min="0" step=".1" value="0" class="form-control"></div><div class="col-12"><button class="btn btn-primary">Save vehicle</button></div></div></form>{% endblock %}
