{% extends "admin/base_admin.html" %}{% block content %}<div class="page-head"><div><h1>Record maintenance</h1><div class="muted">Track vehicle servicing and repair costs.</div></div></div><form method="post" class="panel">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Vehicle</label><select name="vehicle" required class="form-select">{% for v in vehicles %}<option value="{{ v.pk }}">{{ v.vehicle_name }} · {{ v.registration_number }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Maintenance date</label><input name="maintenance_date" type="date" required class="form-control"></div><div class="col-md-6"><label class="form-label">Type</label><input name="maintenance_type" required class="form-control" placeholder="Oil change, tyre replacement..."></div><div class="col-md-6"><label class="form-label">Amount (₹)</label><input name="amount" type="number" min="0" step=".01" value="0" class="form-control"></div><div class="col-md-6"><label class="form-label">Odometer (km)</label><input name="odometer" type="number" min="0" step=".1" required class="form-control"></div><div class="col-md-6"><label class="form-label">Next service date</label><input name="next_service_date" type="date" class="form-control"></div><div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control"></textarea></div><div class="col-12"><button class="btn btn-primary">Save maintenance</button></div></div></form>{% endblock %}
