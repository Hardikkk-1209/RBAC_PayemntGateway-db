{% extends "admin/base_admin.html" %}{% block content %}<div class="page-head"><div><h1>Record fuel refill</h1><div class="muted">Record petrol, CNG or diesel purchases.</div></div></div><form method="post" enctype="multipart/form-data" class="panel">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Vehicle</label><select name="vehicle" required class="form-select">{% for v in vehicles %}<option value="{{ v.pk }}">{{ v.vehicle_name }} · {{ v.registration_number }} · {{ v.get_fuel_type_display }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Refill date and time</label><input type="datetime-local" name="refill_date" required class="form-control"></div><div class="col-md-4"><label class="form-label">Quantity</label><input name="quantity" type="number" step=".01" min=".01" required class="form-control"></div><div class="col-md-4"><label class="form-label">Unit</label><select name="unit" class="form-select"><option value="litres">Litres</option><option value="kg">KG</option></select></div><div class="col-md-4"><label class="form-label">Amount (₹)</label><input name="amount" type="number" step=".01" min="0" required class="form-control"></div><div class="col-md-6"><label class="form-label">Odometer (km)</label><input name="odometer" type="number" step=".1" min="0" required class="form-control"></div><div class="col-md-6"><label class="form-label">Receipt (optional)</label><input type="file" name="receipt" class="form-control" accept="image/*,.pdf"></div><div class="col-12"><label class="form-label">Remarks</label><textarea name="remarks" class="form-control"></textarea></div><div class="col-12"><button class="btn btn-primary">Save refill</button></div></div></form>{% endblock %}
