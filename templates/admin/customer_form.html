{% extends "admin/base_admin.html" %}{% block content %}<div class="page-head"><div><h1>New customer</h1><div class="muted">Create a customer before admission.</div></div></div><form method="post" enctype="multipart/form-data" class="panel">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Full name *</label><input required name="full_name" class="form-control"></div><div class="col-md-6"><label class="form-label">Phone *</label><input required name="phone" class="form-control"></div><div class="col-md-6"><label class="form-label">Date of birth</label><input type="date" name="date_of_birth" class="form-control"></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div><div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control"></textarea></div><div class="col-md-6"><label class="form-label">Photograph</label><input type="file" name="photograph" accept="image/*" class="form-control"></div><div class="col-12"><button class="btn btn-primary">Save and continue</button></div></div></form>{% endblock %}
