{% extends "base.html" %}{% block body %}<div class="shell"><header class="topbar"><a class="brand" href="{% url 'dashboard' %}">Professional<span style="color:#2861dc">.</span></a><div class="actions"><span class="subtle">Owner workspace</span><form method="post" action="{% url 'admin_logout' %}">{% csrf_token %}<button class="btn btn-outline-secondary btn-sm">Sign out</button></form></div></header><div class="layout"><aside class="sidebar">{% for label,url_name in nav_items %}<a class="nav-link {% if request.resolver_match.url_name == url_name %}active{% endif %}" href="{% url url_name %}">{{ label }}</a>{% endfor %}<a class="nav-link" href="{% url 'home' %}">View public website ↗</a></aside><main class="content">{% for message in messages %}<div class="alert alert-info py-2">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></div></div>{% endblock %}
