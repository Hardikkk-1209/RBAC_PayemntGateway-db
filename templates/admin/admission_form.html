{% extends "admin/base_admin.html" %}{% block content %}<div class="page-head"><div><h1>New admission</h1><div class="muted">Set the customer's course, vehicle, fee and validity.</div></div></div><form method="post" class="panel">{% csrf_token %}<div class="row g-3"><div class="col-12"><label class="form-label">Existing customer</label><select name="customer" class="form-select"><option value="">Create new customer below</option>{% for c in customers %}<option value="{{ c.pk }}" {% if selected_customer == c.pk|stringformat:"s" %}selected{% endif %}>{{ c.full_name }} · {{ c.phone }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">New customer name</label><input name="full_name" class="form-control"></div><div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control"></div><div class="col-md-6"><label class="form-label">Date of birth</label><input type="date" name="date_of_birth" class="form-control"></div><div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div><div class="col-md-6"><label class="form-label">Course</label><select required name="course" id="course" class="form-select">{% for c in courses %}<option value="{{ c.pk }}" data-category="{{ c.category }}">{{ c.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Vehicle</label><select required name="vehicle" id="vehicle" class="form-select">{% for v in vehicles %}<option value="{{ v.pk }}" data-category="{{ v.category }}">{{ v.vehicle_name }} · {{ v.registration_number }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Training start date</label><input type="date" name="training_start_date" value="{{ default_training_start }}" required class="form-control"><div class="form-text">The system creates one session per day from this date.</div></div><div class="col-md-6"><label class="form-label">Trainer</label><select name="trainer" required class="form-select">{% for e in employees %}<option value="{{ e.pk }}">{{ e.employee_name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Custom fee (₹)</label><input required min="0" step=".01" type="number" name="custom_fee" class="form-control"></div><div class="col-md-4"><label class="form-label">Sessions</label><input type="number" name="total_sessions" value="21" min="1" class="form-control"></div><div class="col-md-4"><label class="form-label">Validity (days)</label><input type="number" name="validity_days" value="30" min="1" class="form-control"></div><div class="col-12"><button class="btn btn-primary">Create admission</button></div></div></form><script>const c=document.getElementById('course'),v=document.getElementById('vehicle');function filter(){[...v.options].forEach(o=>o.hidden=o.dataset.category!==c.selectedOptions[0].dataset.category)}c.addEventListener('change',filter);filter()</script>{% endblock %}
